<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arrow</title>
  </head>
  <body>
    <div id="output">ผลรวม</div>
    <button onclick="Run()">Run</button>

    <script>
      function Run() {
        const output = [];

        function sayHi() {
          output.push("Hi");
          console.log("Hi");
        }

        sayHi();

        const sayHiArrow = () => {
          output.push("Hi from Arrow");
          console.log("Hi from Arrow");
        };

        sayHiArrow();

        function greet(name) {
          output.push("Hello " + name);
          console.log("Hello " + name);
        }

        greet("Alex");

        function add(a, b) {
          return a + b;
        }

        let sum = add(5, 7);
        output.push("ผลรวม 5 + 7 = " + sum);
        console.log("ผลรวม:", sum);

        document.getElementById("output").textContent = output.join("\n");
      }
    </script>
  </body>
</html>
